<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haven</title>
<script>
  // Theme before first paint, so the page never flashes the wrong theme.
  // Stored choice wins; otherwise follow the system (spec §2). The same
  // rule lives in /shell-logic.js for the running app; this copy exists
  // only so it can run before the stylesheet loads.
  try {
    var storedTheme = localStorage.getItem("haven-theme");
    document.documentElement.setAttribute("data-theme",
      storedTheme === "light" || storedTheme === "dark" ? storedTheme :
      (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  } catch (e) { /* private mode: fall through to light */ }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600;6..72,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/components.css">
</head>
<body>
<header class="shell-header">
  <button class="wordmark" id="home-control" type="button" aria-label="Haven home">Haven</button>
  <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch theme"></button>
</header>
<main id="app"></main>
<nav id="bottomnav" class="bottom-nav" aria-label="Modules"></nav>
<div id="sheet-root"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
