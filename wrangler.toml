# Haven Worker — one Worker serving the SPA and the API (spec §11).
name = "haven"
main = "shell/src/index.ts"
compatibility_date = "2026-11-19"
compatibility_flags = ["nodejs_compat"]

# Build: assemble dist/ (shell assets + module client chunks) before deploy.
# Workers Builds runs this command, then `npx wrangler deploy`.
[build]
command = "npm run build"

# Static assets: the assembled SPA in dist/. run_worker_first makes the
# Worker authoritative for every request (local dev and the edge behave the
# same): /api/* is answered as JSON, a matching asset is served via the
# ASSETS binding, and everything else falls back to index.html for
# client-side routes. Without it, unmatched non-API paths are answered by
# the assets layer itself (a 307 redirect to / in local dev) and never
# reach the Worker's SPA fallback.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

# D1 — one database for the whole app (spec §11). Tables are prefixed per
# module (cook_*, shop_*); shell tables are unprefixed.
# Database recreated 2026-11-20 with an APAC primary (was ENAM, ~250ms/query):
# old DB 6e60ddbf-ad98-4a12-ac7f-1d4d3f38af15 deleted; id below is the new one.
[[d1_databases]]
binding = "DB"
database_name = "haven-apac"
database_id = "add5f3b5-e586-410d-9c44-0c3b7b038795"
migrations_dir = "shell/migrations"

# Observability: keep invocation logs enabled (Don't Ngiao lesson, Nov 2026).
# With logs persisted, a failing request shows its server-side exception in
# Workers > haven > Logs instead of being masked as a generic load failure.
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true
