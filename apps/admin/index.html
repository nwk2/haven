<!doctype html>
<html lang="en" data-theme="night" data-mode="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico">
  <title>Haven admin</title>
  <script>
    try { var t = JSON.parse(localStorage.getItem("haven-admin:theme") || "null"); if (t) { document.documentElement.dataset.theme = t.theme; document.documentElement.dataset.mode = t.mode; } } catch (e) {}
  </script>
</head>
<body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
